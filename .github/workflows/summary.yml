name: 업무일지 요약 메일
on:
  schedule:
    - cron: '0 10 * * 1-5' # 평일 19:00 KST → 일간 (주말 제외)
    - cron: '0 10 * * 5'   # 매주 금 19:00 KST → 주간 (토–금 7일)
    - cron: '0 10 28-31 * *' # 28–31일 19:00 KST → 말일에만 월간 (아래에서 확인)
  workflow_dispatch:
    inputs:
      period:
        description: 'day | week | month'
        default: 'day'
      to:
        description: '받는 사람만 지정 (테스트용; 비우면 평소 수신자)'
        default: ''
jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Pick period
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "period=${{ github.event.inputs.period }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 10 28-31 * *" ]; then
            if [ "$(TZ=Asia/Seoul date -d tomorrow +%d)" = "01" ]; then echo "period=month" >> $GITHUB_OUTPUT; else echo "period=skip" >> $GITHUB_OUTPUT; fi
          elif [ "${{ github.event.schedule }}" = "0 10 * * 5" ]; then echo "period=week" >> $GITHUB_OUTPUT
          else echo "period=day" >> $GITHUB_OUTPUT; fi
      - name: Send
        if: steps.p.outputs.period != 'skip'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ github.event.inputs.to || vars.MAIL_TO || 'dayoung@kist.re.kr' }}
          MAIL_TO_REPORT: ${{ !github.event.inputs.to && vars.MAIL_TO_REPORT || '' }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python scripts/summary.py ${{ steps.p.outputs.period }}
