name: 업무일지 요약 메일
on:
  schedule:
    - cron: '0 10 * * 1-5' # 평일 19:00 KST → 일간 (주말 제외)
    - cron: '0 0 * * 1'    # 매주 월 09:00 KST → 주간
    - cron: '0 0 1 * *'    # 매월 1일 09:00 KST → 월간
  workflow_dispatch:
    inputs:
      period:
        description: 'day | week | month'
        default: 'day'
jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Pick period
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "period=${{ github.event.inputs.period }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 1 * *" ]; then echo "period=month" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * 1" ]; then echo "period=week" >> $GITHUB_OUTPUT
          else echo "period=day" >> $GITHUB_OUTPUT; fi
      - name: Send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO || 'dayoung@kist.re.kr' }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python scripts/summary.py ${{ steps.p.outputs.period }}
